# ⚠️⚠️⚠️ CNV 4.21 ONLY — DO NOT USE ON CNV 4.22 + AIE ⚠️⚠️⚠️
#
# On CNV 4.22 the NV launcher provides the coherent-memory description, and
# this option instead forces the driver into a failing BAR-path self-test:
#   NVRM: GPU0 kbusVerifyBar2_GH100: MMUTest BAR0 window offset 0x70e000 returned garbage 0x0
#   NVRM: GPU 0000:ff:00.0: RmInitAdapter failed! (0x24:0x72:1298)
# Result: nvidia-smi "No devices were found", cuInit 999.
# If it is installed, remove it and reboot:
#   sudo rm -f /etc/modprobe.d/nvidia-forcebarpath.conf && sudo reboot
#
# ------------------------------------------------------------------------
# Historical (CNV 4.21) documentation:
#
# In-guest NVIDIA driver configuration: force BAR path instead of the Grace C2C
# coherent-memory path.
#
# WHY: on a Grace host the RM expects the GPU's coherent (NVLink-C2C) FB window to
# be described by platform firmware (ACPI DSD). A 4.21 VM has no such description, so
# driver init fails with:
#   NVRM: GPU0 kmemsysSetupCoherentCpuLink_IMPL: Failed to get coherent GPU memory base address
#   NVRM: GPU0 RmInitNvDevice: *** Cannot initialize the device
# The RMForceBarPath registry key ("disable coherent path CPU->Nvlink/C2C->FB and
# force BAR path", nvrm_registry.h) skips that path and uses plain PCIe BARs.
#
# Install to /etc/modprobe.d/nvidia-forcebarpath.conf and REBOOT the guest.
# (Do not try `modprobe -r nvidia` after a failed probe — the unload hangs.)
options nvidia NVreg_RegistryDwords="RMForceBarPath=1"
