# The working GPU VM definition for CNV 4.22 + AIE (validated 2026-11-01:
# nvidia-smi, CUDA driver API, cuda-samples suite, 2-GPU P2P).
#
# Key points:
#   - gpus.deviceName nvidia.com/31c2      -> VFIO passthrough of the GB300
#     (AIE webhook swaps the launcher to virt-launcher-4-nv-rhel10)
#   - devices.kubevirt.io/iommufd: "1"     -> kernel iommufd VFIO container
#   - cpu.numa.guestMappingPassthrough + dedicatedCpuPlacement + 2Mi hugepages
#     -> required for AIE to generate the vSMMUv3 (accel/ATS/PASID), the GPU
#     ACPI NUMA nodes and hugepage-backed memfd memory
#   - NO hook sidecar annotation: on 4.22 AIE sizes the PCI window
#     (pcihole64) itself; the old 16T MMIO hook from 4.21 BREAKS GPU init
#     (see README 4.3 / 5.2 - the two legacy workarounds are harmful on 4.22)
#   - nodeSelector pins to the node that hosts the GPUs
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: gpu-vm
  namespace: gpu-vm-test
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: gpu-vm
        kubevirt.io/vm: gpu-vm
    spec:
      architecture: arm64
      nodeSelector:
        kubernetes.io/hostname: compute-tray-11
      domain:
        machine:
          type: virt
        cpu:
          cores: 2
          dedicatedCpuPlacement: true
          numa:
            guestMappingPassthrough: {}
        resources:
          requests:
            memory: 16Gi
          limits:
            devices.kubevirt.io/iommufd: "1"
        memory:
          guest: 16Gi
          hugepages:
            pageSize: 2Mi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinit
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
          gpus:
          - name: gpu1
            deviceName: nvidia.com/31c2
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        dataVolume:
          name: gpu-vm-rhel-root
      - name: cloudinit
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: gpu-vm
            ssh_authorized_keys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA<replace-with-your-public-key> user@example.com
