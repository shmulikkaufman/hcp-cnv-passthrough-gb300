# GPU operator ClusterPolicy in KubeVirt VM-passthrough (sandbox) mode.
# In this mode the operator does NOT install a node driver; instead:
#   - vfioManager binds the GPUs on the node to vfio-pci
#   - sandboxDevicePlugin advertises nvidia.com/31c2 as an extended resource
#     (externalResourceProvider) so KubeVirt can schedule VMs with `gpus:`
# The in-guest driver is installed manually inside the VM (see 05-guest-driver/).
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  operator:
    use_ocp_driver_toolkit: true
  sandboxWorkloads:
    enabled: true
    defaultWorkload: vm-passthrough
    mode: kubevirt
  sandboxDevicePlugin:
    enabled: true
  vfioManager:
    enabled: true
  driver:
    enabled: true
    useNvidiaDriverCRD: false
    kernelModuleType: auto
  dcgm:
    enabled: true
  dcgmExporter:
    enabled: true
    serviceMonitor:
      enabled: true
  daemonsets:
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
  devicePlugin:
    enabled: true
  gfd:
    enabled: true
  nodeStatusExporter:
    enabled: true
  toolkit:
    enabled: true
  validator:
    plugin:
      env: []
